    label:
      en_US: all
      zh_Hans: all
  - value: image
    label:
      en_US: image
      zh_Hans: image
  - value: video
    label:
      en_US: video
      zh_Hans: video
  - value: music
    label:
      en_US: music
      zh_Hans: music
