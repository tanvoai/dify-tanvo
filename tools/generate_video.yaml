identity:
  name: generate_video
  author: tanvo
  label:
    en_US: Generate Video
    zh_Hans: 生成视频
description:
  human:
    en_US: Text to video, or animate a start frame (with an optional end frame), on Kling, Veo, Seedance, Wan, LTX and MiniMax, most with sound.
    zh_Hans: 文生视频，或让首帧动起来（可设尾帧），多数模型带声音。
  llm: 'Generates a short video with Tanvo from a prompt describing the shot (subject, action, camera, sound), optionally starting from an image. Videos take one to several minutes: if status is not SUCCEEDED,
    call Get Generation with the generation_id. A successful submission is not a finished video.'
parameters:
- name: prompt
  type: string
  required: true
  form: llm
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: 'The shot: subject, action, camera and sound.'
    zh_Hans: 镜头：主体、动作、运镜和声音。
  llm_description: 'The shot to generate: subject, action, camera movement, lighting and sound.'
- name: start_image
  type: file
  required: false
  form: llm
  label:
    en_US: Start image
    zh_Hans: 首帧
  human_description:
    en_US: Optional image to animate.
    zh_Hans: 可选：让这张图动起来。
  llm_description: Optional image the video starts from.
- name: end_image
  type: file
  required: false
  form: llm
  label:
    en_US: End image
    zh_Hans: 尾帧
  human_description:
    en_US: Optional image to end on (models that support it).
    zh_Hans: 可选：结束画面（部分模型支持）。
- name: model
  type: select
  required: false
  form: form
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Which model to run. Prices are in credits at the model's default settings.
    zh_Hans: 用哪个模型。价格是默认设置下的积分。
  options:
  - value: studio-video-v1
    label:
      en_US: Tanvo Video v1 (about 20 credits)
      zh_Hans: Tanvo Video v1 (about 20 credits)
  - value: minimax-h3
    label:
      en_US: MiniMax H3 (about 90 credits)
      zh_Hans: MiniMax H3 (about 90 credits)
  - value: seedance-2-5
    label:
      en_US: Seedance 2.5 (about 300 credits)
      zh_Hans: Seedance 2.5 (about 300 credits)
  - value: seedance-2
    label:
      en_US: Seedance 2.0 (about 480 credits)
      zh_Hans: Seedance 2.0 (about 480 credits)
  - value: seedance-2-fast
    label:
      en_US: Seedance 2 Fast (about 445 credits)
      zh_Hans: Seedance 2 Fast (about 445 credits)
  - value: seedance-2-mini
    label:
      en_US: Seedance 2 Mini (about 130 credits)
      zh_Hans: Seedance 2 Mini (about 130 credits)
  - value: seedance-1-5-pro
    label:
      en_US: Seedance 1.5 Pro (about 115 credits)
      zh_Hans: Seedance 1.5 Pro (about 115 credits)
  - value: kling-3-0
    label:
      en_US: Kling 3.0 (about 155 credits)
      zh_Hans: Kling 3.0 (about 155 credits)
  - value: kling-2-6
    label:
      en_US: Kling 2.6 (about 130 credits)
      zh_Hans: Kling 2.6 (about 130 credits)
  - value: kling-3-turbo
    label:
      en_US: Kling 3.0 Turbo (about 210 credits)
      zh_Hans: Kling 3.0 Turbo (about 210 credits)
  - value: veo-3-1
    label:
      en_US: Veo 3.1 (about 115 credits)
      zh_Hans: Veo 3.1 (about 115 credits)
  - value: wan-3-0
    label:
      en_US: Wan 3.0 (about 185 credits)
      zh_Hans: Wan 3.0 (about 185 credits)
  - value: ltx-2-5
    label:
      en_US: LTX 2.5 (about 185 credits)
      zh_Hans: LTX 2.5 (about 185 credits)
  - value: flux-3
    label:
      en_US: FLUX 3 (about 315 credits)
      zh_Hans: FLUX 3 (about 315 credits)
  default: kling-3-0
- name: aspect
  type: select
  required: false
  form: form
  label:
    en_US: Aspect ratio
    zh_Hans: 画面比例
  human_description:
    en_US: Not every model takes every ratio.
    zh_Hans: 不是每个模型都支持所有比例。
  options:
  - value: auto
    label:
      en_US: Model default
      zh_Hans: Model default
  - value: '16:9'
    label:
      en_US: '16:9'
      zh_Hans: '16:9'
  - value: '9:16'
    label:
      en_US: '9:16'
      zh_Hans: '9:16'
  - value: '1:1'
    label:
      en_US: '1:1'
      zh_Hans: '1:1'
  default: auto
- name: resolution
  type: select
  required: false
  form: form
  label:
    en_US: Resolution
    zh_Hans: 分辨率
  human_description:
    en_US: Output resolution.
    zh_Hans: 输出分辨率。
  options:
  - value: auto
    label:
      en_US: Model default
      zh_Hans: Model default
  - value: 480p
    label:
      en_US: 480p
      zh_Hans: 480p
  - value: 768p
    label:
      en_US: 768p
      zh_Hans: 768p
  - value: 1080p
    label:
      en_US: 1080p
      zh_Hans: 1080p
  - value: 720p
    label:
      en_US: 720p
      zh_Hans: 720p
  - value: 4K
    label:
      en_US: 4K
      zh_Hans: 4K
  - value: 2K
    label:
      en_US: 2K
      zh_Hans: 2K
  default: auto
- name: duration
  type: number
  required: false
  form: form
  label:
    en_US: Duration (seconds)
    zh_Hans: 时长（秒）
  human_description:
    en_US: Leave empty for the model's default; each model takes a few fixed lengths.
    zh_Hans: 留空用模型默认；每个模型只支持几种固定时长。
  min: 3
  max: 30
- name: audio
  type: select
  required: false
  form: form
  label:
    en_US: Sound
    zh_Hans: 声音
  human_description:
    en_US: Sound with the video, on models that can make it. Model default is on for most.
    zh_Hans: 是否带声音（部分模型支持）。
  options:
  - value: auto
    label:
      en_US: Model default
      zh_Hans: Model default
  - value: 'on'
    label:
      en_US: 'On'
      zh_Hans: 'On'
  - value: 'off'
    label:
      en_US: 'Off'
      zh_Hans: 'Off'
  default: auto
- name: tier
  type: select
  required: false
  form: form
  label:
    en_US: Quality tier
    zh_Hans: 质量档位
  human_description:
    en_US: 'Veo 3.1 only: Lite, Fast or Quality.'
    zh_Hans: 仅 Veo 3.1：Lite、Fast 或 Quality。
  options:
  - value: auto
    label:
      en_US: Model default
      zh_Hans: Model default
  - value: Lite
    label:
      en_US: Lite
      zh_Hans: Lite
  - value: Fast
    label:
      en_US: Fast
      zh_Hans: Fast
  - value: Quality
    label:
      en_US: Quality
      zh_Hans: Quality
  default: auto
- name: wait_seconds
  type: number
  required: false
  form: form
  label:
    en_US: Wait (seconds)
    zh_Hans: 等待（秒）
  human_description:
    en_US: How long to wait for the result, up to 240. If the run is still going, the tool returns its generation_id for Get Generation.
    zh_Hans: 最多等多久，最长 240 秒。还没完成就返回 generation_id，之后用 Get Generation 取结果。
  default: 240
  min: 0
  max: 240
extra:
  python:
    source: tools/generate_video.py
